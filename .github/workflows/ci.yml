name: CI & Build Verification

on:
  push:
    branches: [main, master, feat/windows-desk]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend TypeScript check & Build
        run: pnpm build

      - name: Frontend Vitest test suite
        run: pnpm test

      - name: Install Chromium for browser smoke tests
        run: pnpm exec playwright install chromium

      - name: Browser smoke tests
        run: pnpm test:smoke

      - name: Rust formatting check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust Clippy linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Desktop Package
        run: pnpm tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: codenotch-windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
